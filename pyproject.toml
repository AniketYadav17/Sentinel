[project]
name = "sentinel"
version = "0.1.0"
description = "Audits fintech customer communications against the FCA Handbook — eval-gated agentic RAG"
readme = "README.md"
authors = [
    { name = "Aniket", email = "41797865+AniketYadav17@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = ["langgraph>=0.4"]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
mcp = [
    "mcp>=1.2",
]
rerank = [
    "sentence-transformers>=3",
]
